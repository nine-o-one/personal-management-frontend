server {
    # NGINX listens on port 80 inside the container
    listen 80;
    
    # 1. Serve the Frontend Static Files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Crucial for Single Page Applications (React/Vue/Angular) to handle routing natively
        try_files $uri $uri/ /index.html; 
    }

    # 2. Forward API Requests to the Backend
    location /api/ {
        # Forward traffic to the backend container on port 5000
        proxy_pass http://backend:5000; 
        
        # Pass along standard headers so Flask knows the original request details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}